# Railway project config. VPS control panel: web-based terminal + file manager.
#
#   A) "manager" + "web"   -> two services (manager runs the API+PTY, web is the dashboard)
#   B) "combined"          -> one service: manager serves the dashboard itself
#                               (most efficient for Railway free tier)
#
# Deploy what you need. For free hosting, use "combined" (single container).

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"
# Railway uses this root Dockerfile (the combined service) by default.

# ---------- Option A: two services ----------

[[services]]
name = "manager"
dockerfilePath = "manager/Dockerfile"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

  [services.env]
  PORT = "8090"
  MC_SESSION_SECRET = "CHANGE_ME_IN_RAILWAY_DASHBOARD"
  MC_DATA_DIR = "/data"
  MC_PROJECTS_DIR = "/data/projects"

  [services.volumes]
  "/data" = "/data"

[[services]]
name = "web"
dockerfilePath = "web/Dockerfile"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

  [services.env]
  PORT = "3000"
  NEXT_PUBLIC_MANAGER_URL = "${{ services.manager.url }}"

# ---------- Option B: one combined service ----------

[[services]]
name = "combined"
dockerfilePath = "Dockerfile"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

  [services.env]
  PORT = "8090"
  MC_SESSION_SECRET = "CHANGE_ME_IN_RAILWAY_DASHBOARD"
  MC_DATA_DIR = "/data"
  MC_PROJECTS_DIR = "/data/projects"
  # Dashboard is served by the manager on the same origin (relative API paths).

  [services.volumes]
  "/data" = "/data"
